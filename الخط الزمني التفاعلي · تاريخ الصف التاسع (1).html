.n b{display:block;font-size:.85rem}

.n i::before{content:"";position:absolute;top:6px;inset-inline:0;height:2px;background:var(--line)}
.n i::after{content:"";position:absolute;top:0;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--bg)}
.n span{display:block;font-size:.75rem;opacity:.8}

.rt{fill:none;stroke-linecap:round}
.rf{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.4}
.rh{stroke:#e11d48;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:d .9s forwards}
.rx{stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:d 1.2s forwards}

.wp{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.pill{display:inline-block;margin:2px 0 2px 4px;padding:0 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:.85rem}

.dir{margin-top:8px;font-size:.9rem;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px dashed #e11d48}
.f{font-size:.75rem;opacity:.6;padding-bottom:16px}

['١٠٠٦هـ؛ قبله المطهر: +٤٠ معركة','الإمام القاسم بن محمد،المطهر بن يحيى'],
['١٠٤٥هـ / ١٦٣٥م؛ ٤٠٠٠ جندي اختاروا البقاء','المؤيد بن القاسم']];
const X={10:[[59.5,36.3,'خراسان'],[44.4,33.3,'العراق']],13:[[39.7,21.2,'فخ'],[32.3,29.8,'مصر'],[20,29.3],[10,32.8],[-5,34,'فاس']],18:[[38.8,37.2,'الرها'],[36.2,36.2,'أنطاكية'],[36.7,35.6,'معرة النعمان'],[35.2,31.8,'القدس']],20:[[31.2,30,'القاهرة'],[35.2,28.5],[39.8,21.4,'مكة'],[43.3,14.2,'زبيد']],24:[[44.2,33.5,'بغداد'],[36.3,33.5,'دمشق']],25:[[31.2,30,'القاهرة'],[35.3,32.5,'عين جالوت']],32:[[32.5,30,'السويس'],[36,24],[41,17],[43.4,12.6,'باب المندب'],[45,12.9,'عدن']]};
const dirs=['شرقًا','شمالًا شرقيًا','شمالًا','شمالًا غربيًا','غربًا','جنوبًا غربيًا','جنوبًا','جنوبًا شرقيًا'];
let showAll=true;
const dd=(a,b)=>dirs[(Math.round(Math.atan2(b[1]-a[1],b[0]-a[0])/(Math.PI/4))+8)%8];
const pills=(s,sp)=>s.split(sp).map(x=>`<span class="pill">${x.trim()}</span>`).join('');
function seg(a,b,cls,mk,k,col){const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy);if(d<12)return '';
const mx=(a[0]+b[0])/2-dy*k,my=(a[1]+b[1])/2+dx*k,ex=b[0]-dx/d*9,ey=b[1]-dy/d*9;
return `<path class="rt ${cls}" ${cls=='rf'?'':'pathLength="1"'} marker-end="url(#a${mk})" ${col?`style="stroke:${col}"`:''} d="M${a}Q${mx},${my} ${ex},${ey}"/>`}
function route(i){const v=vis(),k=v.indexOf(i),pt=j=>P(E[j][3],E[j][4]);let h='';
if(showAll)for(let n=1;n<v.length;n++)h+=seg(pt(v[n-1]),pt(v[n]),'rf','ink',.18);
const x=X[i];
if(x){const c=E[i][0],w=x.map(q=>P(q[0],q[1]));for(let n=1;n<w.length;n++)h+=seg(w[n-1],w[n],'rx',c,0,G[c][1]);
x.forEach((q,n)=>{if(q[2])h+=`<circle cx="${w[n][0]}" cy="${w[n][1]}" r="3.5" style="fill:${G[c][1]}"/><text class="wp" x="${w[n][0]+6}" y="${w[n][1]+14}">${q[2]}</text>`})}
else if(k>0)h+=seg(pt(v[k-1]),pt(i),'rh','red',.18);
$('#rt').innerHTML=h}
function card2(i){const e=E[i],c=G[e[0]][1],v=vis(),k=v.indexOf(i),d=D[i],x=X[i];let t='';
if(x){const a=x[0],b=x[x.length-1];t='مسار الحدث: '+x.filter(q=>q[2]).map(q=>q[2]).join(' ← ')+' (الاتجاه العام '+dd(a,b)+')'}
else if(k>0){const p=E[v[k-1]];t='الانتقال من «'+p[2]+'» إلى هنا: '+(Math.hypot(e[3]-p[3],e[4]-p[4])<1.2?'في المنطقة نفسها تقريبًا':dd([p[3],p[4]],[e[3],e[4]]))}
const cd=$('#card');cd.style.setProperty('--c',c);
cd.innerHTML=`<div class="y">${G[e[0]][0]} · ${yl(e)} · الحدث ${ar(k+1)} من ${ar(v.length)}</div><div class="t">${e[2]}</div><p>${e[5]}</p><div class="k">الأرقام</div>${pills(d[0],'؛')}<div class="k">الشخصيات</div>${pills(d[1],'،')}${t?`<div class="dir">🧭 ${t}</div>`:''}`}
function go(d){const v=vis(),k=v.indexOf(cur);sel(v[(k+d+v.length)%v.length])}
function draw(){document.querySelectorAll('.n,.m').forEach(n=>n.style.display=on.has(E[n.dataset.i][0])?'':'none');
document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',on.has(c.dataset.k)));
if(!on.has(E[cur][0]))sel(vis()[0]);else{route(cur);card2(cur)}}
$('#chips').onclick=e=>{const k=e.target.dataset.k;if(!k)return;on.has(k)?(on.size>1&&on.delete(k)):on.add(k);draw()};
$('#tl').onclick=e=>{const n=e.target.closest('.n');if(n)sel(+n.dataset.i)};
$('#map').onclick=e=>{const m=e.target.closest('.m');if(m)sel(+m.dataset.i)};
$('#nx').onclick=()=>go(1);$('#pv').onclick=()=>go(-1);
$('#pl').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#pl').textContent='▶ تشغيل تلقائي'}else{$('#pl').textContent='⏸ إيقاف';timer=setInterval(()=>go(1),3500)}};
document.onkeydown=e=>{if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)};
$('#ra').onclick=()=>{showAll=!showAll;$('#ra').textContent='المسار العام: '+(showAll?'تشغيل':'إيقاف');route(cur)};
sel(0,false);
</script>
</body>
</html>
